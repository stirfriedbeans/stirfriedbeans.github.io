<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>just dodos — artist circle portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Londrina+Solid:wght@400;300&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE (from Figma)
   ============================================================ */
:root{
  --bg:#e8e4d8;
  --panel:#f9f9f4;
  --header-home:#dacebd;   /* neutral header on home page */
  --pink:#ffa4b8;
  --yellow:#d2c85a;
  --purple:#c8c2e5;
  --green:#c0d25a;
  --grey:#a99c9c;
  --thumb:#d9d9d9;
  --white:#ffffff;
  --radius:25px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  font-family:'Londrina Solid',cursive;
  color:var(--grey);
  min-height:100vh;
  padding:32px 16px 64px;
  -webkit-font-smoothing:antialiased;
}

/* ---------- title ---------- */
.masthead{text-align:center;margin-bottom:24px;user-select:none}
.masthead .logo{
  background:none;border:none;padding:0;cursor:pointer;
  display:block;margin:0 auto;
  font:inherit;color:inherit;
}
.masthead .logo:focus-visible{outline:3px solid var(--white);outline-offset:6px;border-radius:12px}
/* sequential bounce: each letter of "dodos" hops in turn, then pauses, then loops */
.masthead h1 .bounce{display:inline-block}
.masthead .logo:hover .bounce{animation:letterBounce 2.2s infinite}
.masthead .logo:hover .bounce:nth-of-type(1){animation-delay:0s}
.masthead .logo:hover .bounce:nth-of-type(2){animation-delay:.12s}
.masthead .logo:hover .bounce:nth-of-type(3){animation-delay:.24s}
.masthead .logo:hover .bounce:nth-of-type(4){animation-delay:.36s}
.masthead .logo:hover .bounce:nth-of-type(5){animation-delay:.48s}
@keyframes letterBounce{
  0%   {transform:translateY(0)}
  8%   {transform:translateY(-26px)}
  16%  {transform:translateY(0)}
  22%  {transform:translateY(-9px)}
  28%  {transform:translateY(0)}
  100% {transform:translateY(0)}   /* long tail = the pause before looping */
}
.masthead h1{
  font-family:'Lilita One',cursive;
  font-size:clamp(56px,11vw,128px);
  color:var(--white);
  line-height:.95;
  letter-spacing:1px;
}
.masthead h1 .d1{color:var(--pink)}
.masthead h1 .o1{color:var(--yellow)}
.masthead h1 .d2{color:var(--purple)}
.masthead h1 .o2{color:var(--pink)}
.masthead .tagline{
  font-size:clamp(20px,4vw,40px);
  color:var(--white);
  margin-top:-4px;
}

/* ---------- container + header bar ---------- */
.window{
  max-width:1200px;
  margin:0 auto;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.05);
}
.bar{
  background:var(--header-home);
  height:64px;
  display:flex;
  align-items:center;
  padding:0 28px;
  color:var(--white);
  font-size:clamp(22px,3vw,32px);
  gap:12px;
  transition:background .35s ease;
}
.bar .home-btn{
  background:none;border:none;cursor:pointer;
  color:var(--white);font:inherit;
  display:flex;align-items:center;gap:12px;
  padding:6px 12px;margin-left:-12px;border-radius:14px;
  transition:background .2s ease,transform .2s ease;
}
.bar .home-btn:hover{background:rgba(255,255,255,.2)}
.bar .home-btn:hover .home-ico{transform:translateY(-3px)}
.bar .home-btn:active{transform:scale(.97)}
.bar .home-btn:focus-visible{outline:3px solid var(--white);outline-offset:2px}
.bar .home-ico{width:26px;height:26px;flex:0 0 auto;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.bar .bar-label{font-weight:400}
.bar .close{
  margin-left:auto;
  background:none;border:none;cursor:pointer;
  color:var(--white);
  font-family:'Lilita One',cursive;
  font-size:26px;line-height:1;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s ease,background .2s ease;
}
.bar .close:hover{background:rgba(255,255,255,.25);transform:rotate(90deg)}
.bar .close:focus-visible{outline:3px solid var(--white);outline-offset:2px}

.panel{background:var(--panel);padding:48px 40px 56px}

/* ============================================================
   HOME VIEW
   ============================================================ */
.artist-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:32px;
  max-width:900px;
  margin:0 auto;
}
.artist{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
/* icon: 200px square, 20px radius -> 100px (circle) on hover */
.icon-frame{
  width:200px;height:200px;max-width:100%;
  border-radius:20px;
  overflow:hidden;
  border:10px solid var(--accent);
  background:var(--thumb);
  transition:border-radius .4s cubic-bezier(.34,1.56,.64,1),transform .3s ease;
  cursor:pointer;
}
.icon-frame img{width:100%;height:100%;object-fit:cover;display:block}
.icon-frame:hover,
.icon-frame:focus-visible{border-radius:100px;transform:translateY(-4px)}
.icon-frame:focus-visible{outline:none}

.handle{
  font-family:'Lilita One',cursive;
  color:var(--accent);
  font-size:clamp(20px,2.4vw,32px);
  margin-top:18px;
  word-break:break-word;
}
.socials{display:flex;gap:14px;margin-top:12px}
.socials a{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  transition:transform .18s ease;
}
.socials a svg{width:100%;height:100%}
.socials a:hover,.socials a:focus-visible{
  animation:bounce .45s ease;
  outline:none;
}
.socials a:focus-visible{filter:drop-shadow(0 0 0 var(--accent))}
@keyframes bounce{
  0%{transform:translateY(0) scale(1)}
  35%{transform:translateY(-7px) scale(1.12)}
  70%{transform:translateY(0) scale(.96)}
  100%{transform:translateY(0) scale(1)}
}

.portfolio-btn{
  margin-top:20px;
  background:var(--accent);
  color:var(--white);
  border:none;cursor:pointer;
  font-family:'Lilita One',cursive;
  font-size:clamp(22px,2.4vw,32px);
  padding:8px 0;
  width:200px;max-width:100%;
  border-radius:10px;
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
}
.portfolio-btn:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.12);filter:brightness(1.04)}
.portfolio-btn:active{transform:translateY(-1px)}
.portfolio-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.blurb{
  text-align:center;
  font-size:clamp(20px,2.4vw,32px);
  margin:44px auto 8px;
  max-width:760px;
}
.blurb .num{color:var(--grey);font-weight:normal}

/* ---------- fandom tags ---------- */
.tags-title{
  text-align:center;
  font-size:clamp(22px,2.6vw,32px);
  font-weight:normal;
  margin:20px 0 24px;
}
/* top row: the 2 wide "everyone" tags, centered */
.tags-top{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,240px));
  gap:20px;
  justify-content:center;
  max-width:1040px;
  margin:0 auto 22px;
}
/* main grid: fills COLUMN-first so the Figma column order is preserved.
   Source order is already column-major, so mobile (2 per row) reads
   col1 top-to-bottom, then col2, etc. */
.tags{
  display:grid;
  grid-template-rows:repeat(4,auto);
  grid-auto-flow:column;
  gap:20px;
  justify-content:center;
  max-width:1040px;
  margin:0 auto;
}
.tag{
  width:240px;
  max-width:100%;
  text-align:center;
  color:var(--white);
  font-size:clamp(18px,1.8vw,26px);
  padding:11px 26px;
  border-radius:25px;
  user-select:none;
  transition:transform .18s ease,box-shadow .18s ease;
  cursor:default;
}
.tag:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 6px 14px rgba(0,0,0,.1)}
/* tag color coding — which artist(s) draw the fandom */
.c-pink{background:var(--pink)}
.c-yellow{background:var(--green)}      /* tauge draws in green-family */
.c-purple{background:var(--purple)}
.c-pink-green{background:linear-gradient(90deg,var(--pink),var(--green))}
.c-green-purple{background:linear-gradient(90deg,var(--green),var(--purple))}
.c-pink-purple{background:linear-gradient(90deg,var(--pink),var(--purple))}
.c-all{background:linear-gradient(90deg,var(--pink),var(--green),var(--purple))}

/* ============================================================
   ARTIST VIEW
   ============================================================ */
.artist-view{display:none}
.artist-view.active{display:block;animation:fadein .25s ease}
.home-view.hidden{display:none}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 2-column: profile rail on the left, galleries on the right.
   The rail is a normal grid column so it scrolls with the gallery. */
.av-layout{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:44px;
  align-items:start;
}
.av-head{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  text-align:left;
}
.av-head .icon-frame{width:170px;height:170px;border-width:8px}
.av-head .handle{font-size:clamp(18px,1.8vw,26px);margin-top:14px}
.av-head .icon-frame{cursor:default}
.av-head .icon-frame:hover{border-radius:20px;transform:none} /* no square->circle on artist page */
.av-head .socials{justify-content:flex-start}
.av-bio{
  margin-top:22px;
  font-family:'Londrina Solid',cursive;
  font-weight:300;
  font-size:20px;
  line-height:1.5;
  color:var(--grey);
  max-width:220px;
}

.gallery-label{
  display:inline-block;
  background:var(--accent);
  color:var(--white);
  font-size:clamp(20px,2.2vw,32px);
  padding:8px 40px;
  border-radius:25px;
  margin:8px auto 24px;
}
.gallery-section{text-align:left}
.gallery-section + .gallery-section{margin-top:12px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
  margin:0 0 40px;
}
.cell{
  aspect-ratio:1/1;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--thumb);
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell:hover{transform:scale(1.03);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.cell.empty{cursor:default}
.cell.empty:hover{transform:none;box-shadow:none}

/* ============================================================
   LIGHTBOX
   ============================================================ */
.lightbox{
  position:fixed;inset:0;
  background:rgba(40,36,30,.82);
  display:none;
  align-items:center;justify-content:center;
  z-index:100;
  padding:24px;
  cursor:zoom-out;
}
.lightbox.open{display:flex;animation:lbfade .15s ease}
@keyframes lbfade{from{opacity:0}to{opacity:1}}
.lightbox img{
  max-width:100%;max-height:100%;
  border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  cursor:default;
}
.lightbox .lb-close{
  position:absolute;top:20px;right:26px;
  background:none;border:none;color:#fff;
  font-family:'Lilita One',cursive;font-size:34px;
  cursor:pointer;line-height:1;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
/* tablet: artist page drops to single column */
@media(max-width:900px){
  .av-layout{grid-template-columns:1fr;gap:28px}
  .av-head{margin-bottom:4px;align-items:center;text-align:center}
  .av-head .icon-frame{width:200px;height:200px;border-width:10px}
  .av-head .handle{font-size:clamp(20px,2.4vw,32px);margin-top:18px}
  .av-head .socials{justify-content:center}
  .av-bio{max-width:440px;margin-left:auto;margin-right:auto}
  .gallery-section{text-align:center}
  .grid{max-width:900px;margin-left:auto;margin-right:auto}
}

@media(max-width:820px){
  .panel{padding:36px 22px 44px}
  .artist-row{grid-template-columns:1fr;gap:44px;max-width:340px}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px;max-width:440px}
  /* tags: 2 per row, reading down each Figma column in order */
  .tags{
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:none;
    grid-auto-flow:row;
    gap:14px;
    max-width:440px;
  }
  .tags-top{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    max-width:440px;
    margin-bottom:14px;
  }
  .tag{width:100%;padding:10px 12px;font-size:clamp(15px,3.6vw,20px)}
}

@media(max-width:440px){
  body{padding:20px 10px 48px}
  .panel{padding:28px 16px 36px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .tag{font-size:clamp(13px,3.4vw,17px);padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="masthead">
  <button class="logo" id="logoBtn" aria-label="Back to home">
    <h1>just <span class="bounce d1">d</span><span class="bounce o1">o</span><span class="bounce d2">d</span><span class="bounce o2">o</span><span class="bounce">s</span></h1>
    <div class="tagline">artist circle portfolio</div>
  </button>
</div>

<div class="window">
  <div class="bar" id="bar">
    <button class="home-btn" id="homeBtn" aria-label="Back to home">
      <svg class="home-ico" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9h14v-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="bar-label" id="barLabel">home</span>
    </button>
    <button class="close" id="closeBtn" aria-label="Back to home">✕</button>
  </div>

  <div class="panel">

    <!-- ================= HOME VIEW ================= -->
    <div class="home-view" id="homeView">
      <div class="artist-row" id="artistRow"><!-- artists injected --></div>

      <p class="blurb">just <span class="num">3</span> dodo birds. click on our icons to view our galleries + merch portfolios!</p>

      <h2 class="tags-title">fandom tags</h2>
      <div class="tags-top" id="tagsTop"><!-- wide tags injected --></div>
      <div class="tags" id="tags"><!-- tags injected --></div>
    </div>

    <!-- ================= ARTIST VIEWS (injected) ================= -->
    <div id="artistViews"></div>

  </div>
</div>

<!-- ================= LIGHTBOX ================= -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close image">✕</button>
  <img id="lbImg" src="" alt="">
</div>

<script>
/* ============================================================
   ✏️  EDIT HERE — ARTIST DATA
   ------------------------------------------------------------
   • icon        : profile image in /images/
   • socials     : add/remove links freely. url:"#" = not linked yet.
                   supported keys: instagram, twitter, website
   • artwork /
     merch       : list image filenames in /images/.
                   Add up to 18 per gallery. One file = thumbnail + full view.
   ============================================================ */
const ARTISTS = [
  {
    id:"lillie",
    handle:"@lilliee183",
    barName:"lilliee",
    accent:"#ffa4b8",           // pink
    icon:"images/lillie-icon.png",
    bio:"",                     // <-- paste Lillie's bio text (or leave blank to hide)
    socials:{
      instagram:"https://www.instagram.com/lilliee183/",            // <-- paste Lillie's instagram URL
      website:"https://lilliee.my.canva.site/"               // <-- paste Lillie's website URL
    },
    artwork:{prefix:"images/lillie-art"},
    merch:{prefix:"images/lillie-merch"}
  },
  {
    id:"tauge",
    handle:"@taugeeee",
    barName:"taugeeee",
    accent:"#d2c85a",           // yellow
    icon:"images/tauge-icon.png",
    bio:"Hi, I'm Bean! I've been making merch and designing artwork for more than a decade now. I've worked directly with companies like Cognosphere (Hoyoverse), Anycolor (Nijisanji) and Hololive Production. My main current interest is making my own artbooks/zines. Currently loving Pokemon, Slay the Spire 2, Alien Stage, and GSGW! ",
    socials:{
      instagram:"https://www.instagram.com/taugeeee",            // <-- paste Tauge's instagram URL
      twitter:"https://x.com/taugeeee",              // <-- paste Tauge's twitter URL
      website:"https://taugeeee.wixsite.com/portfolio/conportfolio"               // <-- paste Tauge's website URL
    },
    artwork:{prefix:"images/tauge-art"},
    merch:{prefix:"images/tauge-merch"}
  },
  {
    id:"henley",
    handle:"@henleyconfettey",
    barName:"henley",
    accent:"#c8c2e5",           // purple
    icon:"images/henley-icon.png",
    bio:"",                     // <-- paste Henley's bio text (or leave blank to hide)
    socials:{
      instagram:"https://www.instagram.com/henleyconfettey"            // <-- paste Henley's instagram URL
    },
    artwork:{prefix:"images/henley-art"},
    merch:null                  // <-- no merch section for Henley
  }
];

/* ============================================================
   ✏️  EDIT HERE — FANDOM TAGS
   ------------------------------------------------------------
   color = who draws it:
     "c-pink"(lillie) "c-yellow"(tauge) "c-purple"(henley)
     "c-pink-green"(lillie+tauge) "c-green-purple"(tauge+henley)
     "c-pink-purple"(lillie+henley) "c-all"(everyone)
   ============================================================ */
/* top row — the 2 wide tags everyone draws */
const TAGS_TOP = [
  {label:"pokemon",color:"c-all"},
  {label:"original",color:"c-pink-purple"}
];

/* main grid — listed COLUMN BY COLUMN (col1 top→bottom, then col2, etc).
   Desktop renders this as the 4-column Figma layout.
   Mobile renders 2 per row, reading down each column in order. */
const TAGS = [
  // column 1
  {label:"one piece",color:"c-pink"},
  {label:"inuyasha",color:"c-pink"},
  {label:"hitman reborn",color:"c-pink"},
  {label:"detective conan",color:"c-pink"},
  // column 2
  {label:"witch hat atelier",color:"c-pink-green"},
  {label:"frieren",color:"c-pink-green"},
  {label:"honkai star rail",color:"c-pink-green"},
  {label:"genshin impact",color:"c-yellow"},
  // column 3
  {label:"project sekai",color:"c-yellow"},
  {label:"slay the spire",color:"c-yellow"},
  {label:"luo xiao hei",color:"c-yellow"},
  {label:"alien stage",color:"c-yellow"},
  // column 4
  {label:"sanrio",color:"c-purple"},
  {label:"animal crossing",color:"c-green-purple"},
  {label:"league of legends",color:"c-green-purple"},
  {label:"tamagotchi",color:"c-green-purple"}
];

/* ---------- social icon SVGs ---------- */
const ICONS={
  instagram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.7 0 3 0 4.1.1 1 .1 1.7.2 2.3.5.6.2 1.1.5 1.6 1s.8 1 1 1.6c.3.6.4 1.3.5 2.3.1 1.1.1 1.4.1 4.1s0 3-.1 4.1c-.1 1-.2 1.7-.5 2.3-.2.6-.5 1.1-1 1.6s-1 .8-1.6 1c-.6.3-1.3.4-2.3.5-1.1.1-1.4.1-4.1.1s-3 0-4.1-.1c-1-.1-1.7-.2-2.3-.5-.6-.2-1.1-.5-1.6-1s-.8-1-1-1.6c-.3-.6-.4-1.3-.5-2.3C2 15 2 14.7 2 12s0-3 .1-4.1c.1-1 .2-1.7.5-2.3.2-.6.5-1.1 1-1.6s1-.8 1.6-1c.6-.3 1.3-.4 2.3-.5C8.6 2 8.9 2 12 2zm0 1.8c-2.7 0-3 0-4 .1-.8 0-1.2.2-1.5.3-.4.1-.6.3-.9.6-.3.3-.5.5-.6.9-.1.3-.3.7-.3 1.5-.1 1-.1 1.3-.1 4s0 3 .1 4c0 .8.2 1.2.3 1.5.1.4.3.6.6.9.3.3.5.5.9.6.3.1.7.3 1.5.3 1 .1 1.3.1 4 .1s3 0 4-.1c.8 0 1.2-.2 1.5-.3.4-.1.6-.3.9-.6.3-.3.5-.5.6-.9.1-.3.3-.7.3-1.5.1-1 .1-1.3.1-4s0-3-.1-4c0-.8-.2-1.2-.3-1.5-.1-.4-.3-.6-.6-.9-.3-.3-.5-.5-.9-.6-.3-.1-.7-.3-1.5-.3-1-.1-1.3-.1-4-.1zm0 3.1a5.1 5.1 0 1 1 0 10.2 5.1 5.1 0 0 1 0-10.2zm0 8.4a3.3 3.3 0 1 0 0-6.6 3.3 3.3 0 0 0 0 6.6zm6.5-8.6a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg>',
  twitter:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.2 8.3L23.3 22h-6.6l-5.2-6.8L5.5 22H2.4l7.7-8.8L1 2h6.8l4.7 6.2L18.9 2zm-1.2 18h1.8L7.3 3.8H5.4L17.7 20z"/></svg>',
  website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4" ry="9.5"/><path d="M2.6 12h18.8M4 6.5h16M4 17.5h16"/></svg>'
};

/* ---------- build home ---------- */
const artistRow=document.getElementById('artistRow');
ARTISTS.forEach(a=>{
  const socialLinks=Object.entries(a.socials).map(([k,url])=>

/* ---------- build tags ---------- */
function renderTags(list,target){
  list.forEach(t=>{
    const d=document.createElement('div');
    d.className='tag '+t.color;
    d.textContent=t.label;
    target.appendChild(d);
  });
}
renderTags(TAGS_TOP,document.getElementById('tagsTop'));
renderTags(TAGS,document.getElementById('tags'));

/* ---------- build artist views ---------- */
const viewsEl=document.getElementById('artistViews');

/* Highest image number the auto-detect looks for in each gallery.
   Raise it if you ever go past 24 images in one gallery. */
const MAX_IMAGES = 24;

/* File extension your images use. Change if you switch to .jpg/.webp. */
const EXT = "png";

/* Returns the src if that file exists, otherwise null. */
function probe(src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>res(src);
    img.onerror=()=>res(null);
    img.src=src;
  });
}

/* Finds which files actually exist for a prefix.
   Checks <prefix>1..<prefix>MAX all at once and keeps the ones that
   load, in numeric order. Missing numbers in the middle are skipped
   safely, so gaps in your filenames are fine. */
async function detectImages(prefix){
  const found=await Promise.all(
    Array.from({length:MAX_IMAGES},(_,i)=>probe(`${prefix}${i+1}.${EXT}`))
  );
  return found.filter(Boolean);
}

/* Accepts {prefix:"..."} to auto-detect, or an explicit array of paths. */
async function resolveGallery(cfg){
  if(!cfg)return [];
  if(Array.isArray(cfg))return cfg;
  if(cfg.prefix)return detectImages(cfg.prefix);
  return [];
}

function galleryHTML(imgs,label,accent){
  if(!imgs.length)return '';          // no images -> no section at all
  const cells=imgs.map((src,i)=>
    `<div class="cell" data-img="${src}" role="button" tabindex="0" aria-label="View image ${i+1}">
       <img src="${src}" alt="" loading="lazy">
     </div>`
  ).join('');
  return `<div class="gallery-section">
     <div class="gallery-label" style="background:${accent}">${label}</div>
     <div class="grid">${cells}</div>
   </div>`;
}

/* Fills in an artist's galleries once, the first time their page is opened. */
const galleriesLoaded={};
async function loadGalleries(a){
  if(galleriesLoaded[a.id])return;
  galleriesLoaded[a.id]=true;
  const [art,merch]=await Promise.all([
    resolveGallery(a.artwork),
    resolveGallery(a.merch)
  ]);
  const target=document.querySelector(`#view-${a.id} .av-galleries`);
  if(target)target.innerHTML=galleryHTML(art,'artwork',a.accent)+galleryHTML(merch,'merch',a.accent);
}
ARTISTS.forEach(a=>{
  const socialLinks=Object.entries(a.socials).map(([k,url])=>
    `<a href="${url}" target="_blank" rel="noopener" aria-label="${a.handle} on ${k}">${ICONS[k]}</a>`
  ).join('');
  const v=document.createElement('div');
  v.className='artist-view';
  v.id='view-'+a.id;
  v.style.setProperty('--accent',a.accent);
  v.innerHTML=`
    <div class="av-layout">
      <div class="av-head">
        <div class="icon-frame"><img src="${a.icon}" alt="${a.handle}" loading="lazy"></div>
        <div class="handle">${a.handle}</div>
        <div class="socials">${socialLinks}</div>
        ${a.bio ? `<p class="av-bio">${a.bio}</p>` : ''}
      </div>
      <div class="av-galleries"></div>
    </div>
  `;
  viewsEl.appendChild(v);
});

/* ---------- view switching ---------- */
const bar=document.getElementById('bar');
const barLabel=document.getElementById('barLabel');
const homeView=document.getElementById('homeView');
const HOME_COLOR=getComputedStyle(document.documentElement).getPropertyValue('--header-home').trim();

function openArtist(id){
  const a=ARTISTS.find(x=>x.id===id);
  if(!a)return;
  homeView.classList.add('hidden');
  document.querySelectorAll('.artist-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  bar.style.background=a.accent;
  barLabel.textContent=a.barName;
  loadGalleries(a);
  window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){
  document.querySelectorAll('.artist-view').forEach(v=>v.classList.remove('active'));
  homeView.classList.remove('hidden');
  bar.style.background=HOME_COLOR;
  barLabel.textContent='home';
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
  const opener=e.target.closest('[data-open]');
  if(opener){openArtist(opener.dataset.open);return;}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&document.activeElement.dataset&&document.activeElement.dataset.open){
    e.preventDefault();openArtist(document.activeElement.dataset.open);
  }
});
document.getElementById('closeBtn').addEventListener('click',goHome);
document.getElementById('homeBtn').addEventListener('click',goHome);
document.getElementById('logoBtn').addEventListener('click',goHome);

/* ---------- lightbox ---------- */
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
function openLightbox(src){lbImg.src=src;lightbox.classList.add('open')}
function closeLightbox(){lightbox.classList.remove('open');lbImg.src=''}
document.addEventListener('click',e=>{
  const cell=e.target.closest('.cell');
  if(cell&&!cell.classList.contains('empty')){openLightbox(cell.dataset.img)}
});
document.addEventListener('keydown',e=>{
  const c=document.activeElement;
  if((e.key==='Enter'||e.key===' ')&&c.classList&&c.classList.contains('cell')&&!c.classList.contains('empty')){
    e.preventDefault();openLightbox(c.dataset.img);
  }
  if(e.key==='Escape')closeLightbox();
});
lightbox.addEventListener('click',e=>{if(e.target!==lbImg)closeLightbox()});
document.getElementById('lbClose').addEventListener('click',closeLightbox);
</script>
